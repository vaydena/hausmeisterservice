name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nur den jüngsten Lauf pro Branch/PR: älterer Lauf wird automatisch abgebrochen,
# spart Runner-Zeit bei schnellen Push-Serien.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint + TypeCheck + Test + Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Placeholder-Env-Vars auf Job-Ebene, damit `clientEnv.parse()` beim Import
    # nicht crasht. Werte sind bewusst nicht funktionsfähig — CI baut nur, sie
    # macht keine echten Supabase-Requests. Echte Werte kommen bei Prod-Deploy
    # aus dem Hostinger-Panel.
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key-for-ci
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_APP_NAME: Hausmeisterservice
      SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key-for-ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # --prod ignoriert reine devDependencies; --audit-level=moderate lässt
      # LOW-Findings als Rauschen durch, blockt aber moderate/high/critical.
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=moderate

      # Sprint 132: Bis hierher lief ESLint in diesem Projekt nie — das Script
      # zeigte auf das in Next 16 entfernte `next lint`, eine Config gab es
      # nicht, und CI rief `lint` gar nicht auf. --max-warnings=0 steht im
      # Script: ein Warning, das niemanden aufhaelt, ist keine Messung.
      - name: Lint
        run: pnpm lint

      - name: TypeCheck
        run: pnpm typecheck

      - name: Unit tests (Vitest)
        run: pnpm test

      - name: Production build
        run: pnpm build
